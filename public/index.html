<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Sharston Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  :root{
    --bg: #08090b;
    --panel: #14171a;
    --panel-2: #1b1f23;
    --border: #262b30;
    --amber: #ffb300;
    --amber-dim: #7a5600;
    --amber-glow: rgba(255,179,0,.35);
    --text: #eae7e0;
    --text-dim: #8b9198;
    --green: #35d07f;
    --red: #ff5d5d;
    --blue: #6fb4ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 800px at 50% -10%, #14181c 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom: 48px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width: 480px; margin: 0 auto; padding: 18px 16px 8px; }

  .topbar{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .brand{ font-family:'Space Mono',monospace; font-weight:700; letter-spacing:.12em; font-size:12px; color: var(--amber); text-transform:uppercase; }
  .brand small{ display:block; font-family:'Inter'; letter-spacing:0; text-transform:none; color:var(--text-dim); font-size:11px; margin-top:2px; }
  .clock{ font-family:'Space Mono',monospace; font-size:13px; color:var(--text-dim); text-align:right; }

  .card{
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    position:relative;
    overflow:hidden;
  }

  /* NEXT UP hero — split flap board feel */
  .next-card{
    border-color: var(--amber-dim);
    box-shadow: 0 0 0 1px rgba(255,179,0,.06) inset, 0 12px 32px -18px var(--amber-glow);
  }
  .next-label{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber);
    font-family:'Space Mono',monospace; display:flex; align-items:center; gap:8px;
  }
  .dot{ width:6px;height:6px;border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  .next-title{ font-size:19px; font-weight:700; margin:6px 0 14px; }

  .flap-row{ display:flex; gap:8px; align-items:baseline; }
  .flap{
    font-family:'Space Mono',monospace; font-weight:700; font-size:44px; line-height:1;
    color: var(--amber);
    text-shadow: 0 0 18px var(--amber-glow);
    letter-spacing:.02em;
    font-variant-numeric: tabular-nums;
  }
  .flap-unit{ font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em; margin-right:14px; font-family:'Space Mono',monospace;}
  .next-sub{ margin-top:10px; font-size:13px; color:var(--text-dim); }
  .next-sub b{ color:var(--text); font-weight:600; }

  .section-title{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-dim); margin: 18px 4px 8px;
  }

  .duty-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .duty-head .dnum{ font-family:'Space Mono',monospace; font-size:22px; font-weight:700; }
  .badge{
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    padding:3px 8px; border-radius:6px; border:1px solid var(--border); color:var(--text-dim);
  }
  .badge.type-EARLY{ color:#ffd166; border-color:#4a3a10; }
  .badge.type-MIDDLE{ color:#6fb4ff; border-color:#173350; }
  .badge.type-LATE{ color:#c792ea; border-color:#3a2350; }
  .badge.type-SPLIT{ color:#ff9f6f; border-color:#4a2712; }
  .badge.type-NIGHT{ color:#8fa3ff; border-color:#232a55; }
  .badge.type-4DE, .badge.type-4DM, .badge.type-4DS{ color:#9be89b; border-color:#1e3a1e; }

  .timeline{ position:relative; padding-left:22px; }
  .timeline::before{
    content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px;
    background: linear-gradient(var(--border), var(--border));
  }
  .tl-item{ position:relative; padding-bottom:16px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-dot{
    position:absolute; left:-22px; top:2px; width:12px; height:12px; border-radius:50%;
    background: var(--panel); border:2px solid var(--text-dim);
  }
  .tl-item.active .tl-dot{ border-color: var(--green); box-shadow:0 0 10px var(--green); }
  .tl-item.done .tl-dot{ border-color: var(--border); background: var(--border); }
  .tl-item.brk .tl-dot{ border-color: var(--red); }

  .tl-time{ font-family:'Space Mono',monospace; font-size:13px; color:var(--text-dim); }
  .tl-time b{ color:var(--text); font-size:15px; }
  .tl-body{ font-size:13px; margin-top:3px; }
  .tl-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin-bottom:3px;}
  .tl-item.brk .tl-label{ color: var(--red); }

  .routes{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .board-tag{
    font-family:'Space Mono',monospace; font-size:11px; color:var(--amber);
    letter-spacing:.04em; margin-bottom:2px;
  }
  .board-tag b{ font-weight:700; }
  .route-pill{
    font-family:'Space Mono',monospace; font-size:12px; font-weight:700;
    background: var(--panel-2); border:1px solid var(--border); color:var(--blue);
    padding:2px 8px; border-radius:20px;
  }
  .move-pill{
    font-family:'Space Mono',monospace; font-size:11px; color:var(--text-dim);
    border:1px dashed var(--border); padding:2px 8px; border-radius:20px;
  }

  .row2{ display:flex; gap:10px; }
  .row2 > *{ flex:1; }

  label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); display:block; margin-bottom:6px; }
  select, textarea, input[type=text]{
    width:100%; background: var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px; font-family:'Inter'; font-size:14px; appearance:none;
  }
  select:focus, textarea:focus{ outline:1px solid var(--amber); }

  .day-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; -ms-overflow-style:none; scrollbar-width:none;}
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin:0 4px 10px; flex-wrap:wrap; gap:8px; }
  .seg-group{ display:flex; gap:4px; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:3px; }
  .seg{ font-family:'Inter'; font-weight:600; font-size:12px; padding:6px 12px; border-radius:8px; border:none; background:transparent; color:var(--text-dim); cursor:pointer; }
  .seg.sel{ background:var(--amber); color:#1a1300; }
  .cal-nav{ display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace; font-size:12.5px; color:var(--text-dim); }
  .nav-btn{ padding:4px 10px; font-size:16px; line-height:1; }
  .day-tab.today{ box-shadow: 0 0 0 1px var(--green) inset; }
  .day-tab.today .dow{ color:var(--green); }

  .month-grid{ margin-bottom:10px; }
  .month-dow-row{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); margin-bottom:6px; }
  .month-cells{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .month-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; position:relative;
    border-radius:9px; border:1px solid var(--border); background:var(--panel-2);
    font-family:'Space Mono',monospace; font-size:13px; color:var(--text); cursor:pointer;
  }
  .month-cell.today{ box-shadow:0 0 0 1px var(--green) inset; }
  .month-cell.sel{ border-color:var(--amber); box-shadow:0 0 0 1px var(--amber-dim) inset; }
  .month-cell.assigned::after{ content:''; position:absolute; bottom:4px; width:5px;height:5px;border-radius:50%; background:var(--green); }
  .day-tabs::-webkit-scrollbar{ display:none; }
  .day-tab{
    flex:0 0 auto; font-family:'Space Mono',monospace; font-size:11px; text-align:center;
    padding:8px 10px; border-radius:10px; border:1px solid var(--border); color:var(--text-dim);
    cursor:pointer; background:var(--panel-2); min-width:56px;
  }
  .day-tab .dow{ display:block; font-size:10px; letter-spacing:.06em; }
  .day-tab .dnum2{ display:block; font-size:15px; font-weight:700; margin-top:2px; color:var(--text); }
  .day-tab.sel{ border-color:var(--amber); box-shadow:0 0 0 1px var(--amber-dim) inset; }
  .day-tab.sel .dow{ color:var(--amber); }
  .day-tab.assigned::after{ content:''; display:block; width:5px;height:5px;border-radius:50%; background:var(--green); margin:4px auto 0;}

  button{
    font-family:'Inter'; font-weight:600; font-size:13px; border-radius:10px; border:1px solid var(--border);
    background: var(--panel-2); color:var(--text); padding:10px 14px; cursor:pointer;
  }
  button.primary{ background: var(--amber); color:#1a1300; border-color:var(--amber); }
  button.ghost{ background:transparent; }
  button:active{ transform: translateY(1px); }
  .btn-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

  .muted{ color:var(--text-dim); font-size:12.5px; line-height:1.5; }
  .empty{ text-align:center; padding:22px 10px; color:var(--text-dim); font-size:13.5px; }
  .empty .big{ font-size:26px; margin-bottom:6px; }

  .toast{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    background: var(--panel-2); border:1px solid var(--amber-dim); color:var(--text);
    padding:10px 16px; border-radius:10px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition: opacity .25s, transform .25s;
    max-width: 90%;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  details{ margin-top:4px; }
  summary{ cursor:pointer; font-size:12.5px; color:var(--text-dim); }
  summary:hover{ color:var(--text); }

  .weeklabel{ font-size:12px; color:var(--text-dim); margin-bottom:2px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">Sharston Board<small id="weekLabel">—</small></div>
    <div class="clock" id="clockNow">--:--:--</div>
  </div>

  <div class="card next-card" id="nextCard">
    <div class="next-label"><span class="dot"></span><span id="nextLabel">LOADING</span></div>
    <div class="next-title" id="nextTitle">—</div>
    <div class="flap-row" id="flapRow"></div>
    <div class="next-sub" id="nextSub"></div>
  </div>

  <div class="section-title">Browse duties</div>
  <div class="cal-header">
    <div class="seg-group" id="viewToggle"></div>
    <div class="cal-nav">
      <button class="ghost nav-btn" id="calPrev">‹</button>
      <span id="calNavLabel">—</span>
      <button class="ghost nav-btn" id="calNext">›</button>
    </div>
  </div>
  <div class="day-tabs" id="dayTabs"></div>
  <div class="month-grid" id="monthGrid" style="display:none;"></div>

  <div id="dutyArea"></div>

  <div class="section-title">Phone alerts</div>
  <div class="card">
    <div class="muted" id="notifyStatus">Checking notification support…</div>
    <div class="btn-row">
      <button class="primary" id="btnEnableNotify">Enable phone alerts</button>
      <button id="btnTestAlert">Send test alert (1 min)</button>
      <button id="btnIcs">Download sign-on reminders (.ics)</button>
    </div>
  </div>

  <div class="muted" style="text-align:center; font-size:11px; margin-top:4px; opacity:.6;">Unofficial tool — always check your official duty sheet.</div>

</div>

,"en":"26:02","off":"26:09","bus":"z621","from":"SH","to":"SH"}],"meal":"0h45","paid":"7h42"},{"d":"4905","days":"s","t":"NIGHT","sp":[{"r":"50","on":"18:12","st":"18:19","en":"22:07","off":"22:09","bus":"z619","from":"SH","to":"SH"},{"r":"86, 85, 43","on":"22:48","st":"22:50","en":"25:32","off":"25:39","bus":"z650","from":"SH","to":"SH"}],"meal":"0h39","paid":"6h57"},{"d":"4906","days":"s","t":"NIGHT","sp":[{"r":"43, 103, 86","on":"19:12","st":"19:19","en":"24:02","off":"24:04","bus":"z611","from":"SH","to":"SH"},{"r":"142","on":"24:52","st":"24:54","en":"27:59","off":"28:06","bus":"z605","from":"SH","to":"SH"}],"meal":"0h48","paid":"8h24"},{"d":"4907","days":"s","t":"NIGHT","sp":[{"r":"43, 103","on":"20:12","st":"20:19","en":"24:37","off":"24:39","bus":"z628","from":"SH","to":"SH"},{"r":"142, 43","on":"25:22","st":"25:24","en":"29:02","off":"29:09","bus":"z660","from":"SH","to":"SH"}],"meal":"0h43","paid":"8h27"},{"d":"4908","days":"s","t":"NIGHT","sp":[{"r":"85, 111","on":"20:28","st":"20:35","en":"23:52","off":"23:54","bus":"z645","from":"SH","to":"SH"},{"r":"43, 103","on":"24:47","st":"24:49","en":"29:06","off":"29:13","bus":"z647","from":"SH","to":"SH"}],"meal":"0h53","paid":"8h15"},{"d":"4909","days":"s","t":"NIGHT","sp":[{"r":"101, 142","on":"20:33","st":"20:40","en":"25:29","off":"25:31","bus":"z649","from":"SH","to":"SH"},{"r":"103","on":"26:26","st":"26:28","en":"28:06","off":"28:13","bus":"z643","from":"SH","to":"SH"}],"meal":"0h55","paid":"7h10"},{"d":"4910","days":"s","t":"NIGHT","sp":[{"r":"86, 101","on":"20:43","st":"20:50","en":"24:14","off":"24:16","bus":"z643","from":"SH","to":"SH"},{"r":"43","on":"25:17","st":"25:19","en":"29:32","off":"29:39","bus":"z618","from":"SH","to":"SH"}],"meal":"1h01","paid":"8h26"},{"d":"4911","days":"s","t":"NIGHT","sp":[{"r":"101, 103","on":"21:03","st":"21:10","en":"23:16","off":"23:18","bus":"z644","from":"SH","to":"SH"},{"r":"43","on":"24:17","st":"24:19","en":"28:32","off":"28:39","bus":"z651","from":"SH","to":"SH"}],"meal":"0h59","paid":"7h06"},{"d":"4912","days":"s","t":"NIGHT","sp":[{"r":"101, 86","on":"21:33","st":"21:40","en":"23:32","off":"23:34","bus":"z615","from":"SH","to":"SH"},{"r":"142","on":"24:22","st":"24:24","en":"27:29","off":"27:36","bus":"z617","from":"SH","to":"SH"}],"meal":"0h48","paid":"6h00"},{"d":"4913","days":"s","t":"NIGHT","sp":[{"r":"43","on":"21:42","st":"21:49","en":"24:32","off":"24:34","bus":"z640","from":"SH","to":"SH"},{"r":"43","on":"25:47","st":"25:49","en":"30:02","off":"30:09","bus":"z615","from":"SH","to":"SH"}],"meal":"1h13","paid":"7h57"}]};

<script>
// ---------- Week configuration ----------
// TODO: replace with your own OneSignal App ID (Settings > Keys & IDs in the OneSignal dashboard)
const ONESIGNAL_APP_ID = '8e1e76c5-a521-4b34-85e0-a6cb86de4ae3';
// Cloudflare Worker handling schedule/cancel of push notifications
const NOTIFY_API_BASE = 'https://sharston-notify1.sharstondepot.workers.dev';
const EFFECTIVE_FROM_ISO = '2026-08-30'; // date this duty pattern (Weekday/Saturday/Sunday) took effect

const DOW_SHORT  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_LETTER = ['s','m','u','w','t','f','a']; // index = Date.getDay()
const DOW_SCHED  = ['sunday','weekday','weekday','weekday','weekday','weekday','saturday'];

function dateConfig(iso){
  const d = new Date(iso + 'T00:00:00');
  const dow = d.getDay();
  return {
    iso,
    dow: DOW_SHORT[dow],
    dnum: String(d.getDate()),
    sched: DOW_SCHED[dow],
    letter: DOW_LETTER[dow],
  };
}
function toLocalIso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtTime(raw){
  let [h,m] = raw.split(':').map(Number);
  h = ((h % 24) + 24) % 24;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function fmtDuration(startD, endD){
  const mins = Math.round((endD - startD)/60000);
  const h = Math.floor(mins/60);
  const m = mins % 60;
  return `${h}h${String(m).padStart(2,'0')}`;
}
function isoAdd(iso, days){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return toLocalIso(d);
}
function todayIso(){ return toLocalIso(new Date()); }
function weekStartIso(iso){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() - d.getDay()); // back up to Sunday
  return toLocalIso(d);
}

let assignments = {};      // { '2026-08-31': '2', ... }  personal, from storage
let selectedIso = null;    // currently viewed day
let viewMode = 'week';     // 'week' | 'month'
let weekAnchor = todayIso();       // any iso inside the currently shown week
let monthAnchor = (()=>{ const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; })();

// ---------- Helpers ----------
function pad(n){ return n.toString().padStart(2,'0'); }

function parseTimeOnDate(iso, timeStr){
  // timeStr like "4:13" or "24:05" (next-day hours in HASTUS convention)
  let [h,m] = timeStr.split(':').map(Number);
  let d = new Date(iso + 'T00:00:00');
  if(h >= 24){ h -= 24; d.setDate(d.getDate()+1); }
  d.setHours(h, m, 0, 0);
  return d;
}
function fmtClock(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtDowShort(iso){
  const d = new Date(iso+'T00:00:00');
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + d.getDate() + ' ' + d.toLocaleString('en-GB',{month:'short'});
}

function dutiesForDate(dcfg){
  const arr = WEEK_DATA[dcfg.sched] || [];
  if(dcfg.sched === 'weekday'){
    return arr.filter(x => x.days.includes(dcfg.letter));
  }
  return arr; // saturday/sunday: every entry applies
}

function findDuty(dcfg, dutyNo){
  return dutiesForDate(dcfg).find(x => x.d === dutyNo);
}

// Build the ordered checkpoint list + the "break" (largest gap) for a duty
function analyzeDuty(iso, duty){
  const spells = duty.sp.map(s => ({
    ...s,
    onD: parseTimeOnDate(iso, s.on),
    stD: parseTimeOnDate(iso, s.st),
    enD: parseTimeOnDate(iso, s.en),
    offD: parseTimeOnDate(iso, s.off),
  }));
  // find largest gap between spell[i].offD and spell[i+1].onD -> that's the break
  let breakIdx = -1, maxGap = -1;
  for(let i=0;i<spells.length-1;i++){
    const gap = spells[i+1].onD - spells[i].enD;
    if(gap > maxGap){ maxGap = gap; breakIdx = i; }
  }
  return { spells, breakIdx, breakMs: maxGap };
}

function routesOf(spell){
  return (spell.r || '').split(',').map(s=>s.trim()).filter(Boolean);
}

// ---------- Storage ----------
async function loadAssignments(){
  try{ assignments = JSON.parse(localStorage.getItem('assignments') || '{}'); }
  catch(e){ assignments = {}; }
}
async function saveAssignments(){
  try{ localStorage.setItem('assignments', JSON.stringify(assignments)); }
  catch(e){ console.error('save failed', e); }
}

// ---------- Rendering: Week strip / Month grid ----------
function renderCalendarNav(){
  document.getElementById('viewToggle').innerHTML = `
    <button class="seg ${viewMode==='week'?'sel':''}" id="segWeek">Week</button>
    <button class="seg ${viewMode==='month'?'sel':''}" id="segMonth">Month</button>
  `;
  document.getElementById('segWeek').onclick = ()=>{ viewMode='week'; renderCalendarNav(); };
  document.getElementById('segMonth').onclick = ()=>{ viewMode='month'; renderCalendarNav(); };

  if(viewMode === 'week'){
    document.getElementById('dayTabs').style.display = '';
    document.getElementById('monthGrid').style.display = 'none';
    renderDayTabs();
  } else {
    document.getElementById('dayTabs').style.display = 'none';
    document.getElementById('monthGrid').style.display = '';
    renderMonthGrid();
  }
}

function renderDayTabs(){
  const start = weekStartIso(weekAnchor);
  const days = [...Array(7)].map((_,i)=>dateConfig(isoAdd(start,i)));

  const nav = document.getElementById('calNavLabel');
  const endIso = isoAdd(start,6);
  nav.textContent = `${fmtDowShort(start).replace(/^\w+ /,'')} – ${fmtDowShort(endIso)}`;

  const el = document.getElementById('dayTabs');
  el.innerHTML = '';
  days.forEach(dcfg=>{
    const b = document.createElement('div');
    const isToday = dcfg.iso === todayIso();
    b.className = 'day-tab' + (dcfg.iso===selectedIso?' sel':'') + (assignments[dcfg.iso]?' assigned':'') + (isToday?' today':'');
    b.innerHTML = `<span class="dow">${dcfg.dow}</span><span class="dnum2">${dcfg.dnum}</span>`;
    b.onclick = ()=>{ selectedIso = dcfg.iso; renderDayTabs(); renderDutyArea(); };
    el.appendChild(b);
  });
}

function renderMonthGrid(){
  const { y, m } = monthAnchor;
  const nav = document.getElementById('calNavLabel');
  nav.textContent = new Date(y, m, 1).toLocaleDateString('en-GB', {month:'long', year:'numeric'});

  const firstOfMonth = new Date(y, m, 1);
  const startPad = firstOfMonth.getDay(); // 0=Sun
  const daysInMonth = new Date(y, m+1, 0).getDate();

  const el = document.getElementById('monthGrid');
  el.innerHTML = `<div class="month-dow-row">${DOW_SHORT.map(d=>`<span>${d[0]}</span>`).join('')}</div>`;
  const cellsWrap = document.createElement('div');
  cellsWrap.className = 'month-cells';
  for(let i=0;i<startPad;i++){
    cellsWrap.appendChild(document.createElement('div'));
  }
  for(let day=1; day<=daysInMonth; day++){
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const cell = document.createElement('div');
    const isToday = iso === todayIso();
    cell.className = 'month-cell' + (iso===selectedIso?' sel':'') + (assignments[iso]?' assigned':'') + (isToday?' today':'');
    cell.textContent = day;
    cell.onclick = ()=>{ selectedIso = iso; renderMonthGrid(); renderDutyArea(); };
    cellsWrap.appendChild(cell);
  }
  el.appendChild(cellsWrap);
}

document.getElementById('calPrev').onclick = ()=>{
  if(viewMode==='week'){ weekAnchor = isoAdd(weekStartIso(weekAnchor), -7); renderDayTabs(); }
  else { monthAnchor.m--; if(monthAnchor.m<0){monthAnchor.m=11; monthAnchor.y--;} renderMonthGrid(); }
};
document.getElementById('calNext').onclick = ()=>{
  if(viewMode==='week'){ weekAnchor = isoAdd(weekStartIso(weekAnchor), 7); renderDayTabs(); }
  else { monthAnchor.m++; if(monthAnchor.m>11){monthAnchor.m=0; monthAnchor.y++;} renderMonthGrid(); }
};

// ---------- Rendering: duty picker + timeline for selected day ----------
function renderDutyArea(){
  const el = document.getElementById('dutyArea');
  const dcfg = selectedIso ? dateConfig(selectedIso) : null;
  if(!dcfg){ el.innerHTML=''; return; }
  const options = dutiesForDate(dcfg).slice().sort((a,b)=> a.sp[0].on.localeCompare(b.sp[0].on, undefined, {numeric:true}));
  const currentAssigned = assignments[dcfg.iso] || '';

  function optionsHtml(list){
    return `<option value="">— choose duty number —</option>` +
      list.map(o=>`<option value="${o.d}" ${o.d===currentAssigned?'selected':''}>Duty ${o.d} · ${o.t} · signs on ${fmtTime(o.sp[0].on)}</option>`).join('');
  }

  const pickerHtml = `<div class="card">
    <label>My duty — ${fmtDowShort(dcfg.iso)}</label>
    <input type="text" id="dutySearch" placeholder="Search duty number…" autocomplete="off" style="margin-bottom:8px;">
    <select id="dutySelect">
      ${optionsHtml(options)}
    </select>
  </div>`;

  function attachSelectHandler(){
    document.getElementById('dutySelect').onchange = async (e)=>{
      const v = e.target.value;
      if(v){ assignments[dcfg.iso] = v; } else { delete assignments[dcfg.iso]; }
      await saveAssignments();
      renderCalendarNav();
      renderDutyArea();
      scheduleServerNotifications();
      updateNext();
    };
    document.getElementById('dutySearch').oninput = (e)=>{
      const q = e.target.value.trim().toLowerCase();
      const filtered = q ? options.filter(o => o.d.toLowerCase().includes(q)) : options;
      document.getElementById('dutySelect').innerHTML = optionsHtml(filtered);
    };
  }

  if(!currentAssigned){
    el.innerHTML = pickerHtml + `<div class="card empty"><div class="big">🚌</div>No duty set for this day yet.<br>Pick your duty number above.</div>`;
    attachSelectHandler();
    return;
  }

  const duty = findDuty(dcfg, currentAssigned);
  if(!duty){
    el.innerHTML = pickerHtml + `<div class="card empty">That duty number isn't in the loaded duty list — pick again.</div>`;
    attachSelectHandler();
    return;
  }

  const { spells, breakIdx, breakMs } = analyzeDuty(dcfg.iso, duty);
  const now = new Date();

  let items = '';
  spells.forEach((s, i)=>{
    const isCar = /^z?car/i.test(s.bus);
    const routes = routesOf(s);
    const spellEndD = (i===spells.length-1) ? s.offD : s.enD;
    const active = now >= s.onD && now <= spellEndD;
    const done = now > spellEndD;
    const showResign = i===breakIdx+1 && breakMs >= 120*60000 && s.on !== s.st;
    items += `<div class="tl-item ${active?'active':''} ${done?'done':''}">
      <div class="tl-dot"></div>
      <div class="tl-label">${i===0 || showResign ?'Sign on &amp; start':'Start'}</div>
      ${i===0 || showResign
        ? `<div class="tl-time"><b>${fmtTime(s.on)}</b> sign on at <b>SH</b></div>
           <div class="tl-time"><b>${fmtTime(s.st)}</b> start at <b>${s.from}</b></div>`
        : `<div class="tl-time"><b>${fmtTime(s.st)}</b> start at <b>${s.from}</b></div>`}
      <div class="tl-body">
        <div class="board-tag">Board <b>${s.bus}</b> <span class="muted">(${fmtDuration(s.stD, s.enD)})</span></div>
        ${isCar ? `<span class="move-pill">Vehicle move</span>` : `<div class="routes">${routes.map(r=>`<span class="route-pill">${r}</span>`).join('')}</div>`}
      </div>
      ${i===spells.length-1
        ? `<div class="tl-time" style="margin-top:6px;"><b>${fmtTime(s.en)}</b> arrive at <b>${s.to}</b> &nbsp;→&nbsp; <b>${fmtTime(s.off)}</b> sign off</div>`
        : `<div class="tl-time" style="margin-top:6px;"><b>${fmtTime(s.en)}</b> finish at <b>${s.to}</b></div>`}
    </div>`;

    if(i === breakIdx){
      const brActive = now >= s.enD && now <= spells[i+1].stD;
      const brDone = now > spells[i+1].stD;
      const mins = Math.round((spells[i+1].stD - s.enD)/60000);
      items += `<div class="tl-item brk ${brActive?'active':''} ${brDone?'done':''}">
        <div class="tl-dot"></div>
        <div class="tl-label">Break</div>
        <div class="tl-time"><b>${fmtTime(s.en)}</b> – <b>${fmtTime(spells[i+1].st)}</b> &nbsp;<span class="muted">(${mins} min)</span></div>
      </div>`;
    } else if(i < spells.length-1){
      // short changeover / positioning gap, not the main break
      const gapMin = Math.round((spells[i+1].onD - s.enD)/60000);
      if(gapMin > 0){
        items += `<div class="tl-item">
          <div class="tl-dot"></div>
          <div class="tl-label">Changeover</div>
          <div class="tl-time"><b>${fmtTime(s.en)}</b> – <b>${fmtTime(spells[i+1].on)}</b> <span class="muted">(${gapMin} min)</span></div>
        </div>`;
      }
    }
  });

  const fullSpan = fmtDuration(spells[0].onD, spells[spells.length-1].offD);

  el.innerHTML = pickerHtml + `<div class="card">
    <div class="duty-head">
      <div class="dnum">Duty ${duty.d}</div>
      <div class="badge type-${duty.t}">${duty.t}</div>
    </div>
    <div class="muted" style="margin:-4px 0 12px;">Paid: <b style="color:var(--text);">${duty.paid}</b> &nbsp;·&nbsp; Full shift: <b style="color:var(--text);">${fullSpan}</b></div>
    <div class="timeline">${items}</div>
  </div>`;
  attachSelectHandler();
}

// ---------- Next-up hero ----------
function buildCheckpoints(){
  // returns sorted [{time, label, sub}] across ALL assigned days from now onward
  const cps = [];
  Object.keys(assignments).forEach(iso=>{
    const dcfg = dateConfig(iso);
    const dutyNo = assignments[dcfg.iso];
    if(!dutyNo) return;
    const duty = findDuty(dcfg, dutyNo);
    if(!duty) return;
    const { spells, breakIdx, breakMs } = analyzeDuty(dcfg.iso, duty);
    spells.forEach((s,i)=>{
      const isCar = /^z?car/i.test(s.bus);
      const routeTxt = isCar ? 'vehicle move' : routesOf(s).join(', ');
      const boardTxt = `Board ${s.bus}${routeTxt !== 'vehicle move' ? ' · ' + routeTxt : ''}`;
      if(i===0) cps.push({time:s.onD, label:'Sign on', sub:`${fmtTime(s.on)} · Duty ${duty.d} at ${s.from} · ${fmtDowShort(dcfg.iso)}`, displaySub:`Duty ${duty.d} · ${fmtDowShort(dcfg.iso)}`});
      else if(i===breakIdx+1 && breakMs >= 120*60000 && s.on !== s.st) cps.push({time:s.onD, label:'Sign on', sub:`${fmtTime(s.on)} · Duty ${duty.d} at SH · ${fmtDowShort(dcfg.iso)}`, displaySub:`Duty ${duty.d} · ${fmtDowShort(dcfg.iso)}`});
      cps.push({time:s.stD, label:'Start service', sub: `${fmtTime(s.st)} · ${boardTxt}`});
      if(i===breakIdx){
        cps.push({time:s.enD, label:'Break starts', sub:`${fmtTime(s.en)} until ${fmtTime(spells[i+1].st)}`});
        cps.push({time:spells[i+1].stD, label:'Break ends', sub:`${spells[i+1].st} · back on shift`});
      }
      if(i===spells.length-1) cps.push({time:s.offD, label:'Sign off', sub:`${fmtTime(s.off)} · Duty ${duty.d} at ${s.to} · ${fmtDowShort(dcfg.iso)}`, displaySub:`Duty ${duty.d} · ${fmtDowShort(dcfg.iso)}`});
    });
  });
  cps.sort((a,b)=> a.time - b.time);
  return cps;
}

function updateNext(){
  const now = new Date();
  document.getElementById('clockNow').textContent = fmtClock(now) + ':' + pad(now.getSeconds());
  const ef = new Date(EFFECTIVE_FROM_ISO+'T00:00:00');
  document.getElementById('weekLabel').textContent = 'Duties effective from ' + ef.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

  const cps = buildCheckpoints();
  const hasAnyAssignment = Object.keys(assignments).length > 0;
  const next = cps.find(c => c.time > now);

  if(!next){
    if(!hasAnyAssignment){
      document.getElementById('nextLabel').textContent = 'NO DUTY SET';
      document.getElementById('nextTitle').textContent = 'Pick a duty below to get started';
    } else {
      document.getElementById('nextLabel').textContent = 'ALL DONE';
      document.getElementById('nextTitle').textContent = "Nothing left in this week's loaded duties";
    }
    document.getElementById('flapRow').innerHTML = '';
    document.getElementById('nextSub').textContent = '';
    return;
  }

  const diffMs = next.time - now;
  const totalMin = Math.floor(diffMs/60000);
  const hh = Math.floor(totalMin/60);
  const mm = totalMin % 60;
  const ss = Math.floor((diffMs%60000)/1000);

  document.getElementById('nextLabel').textContent = next.label.toUpperCase();
  document.getElementById('nextTitle').textContent = (next.displaySub || next.sub).replace(/^\d{1,2}:\d{2}\s*·\s*/, '');
  document.getElementById('flapRow').innerHTML = `
    <span class="flap">${hh}</span><span class="flap-unit">hr</span>
    <span class="flap">${pad(mm)}</span><span class="flap-unit">min</span>
    <span class="flap">${pad(ss)}</span><span class="flap-unit">sec</span>
  `;
  document.getElementById('nextSub').innerHTML = `At <b>${fmtClock(next.time)}</b> on ${fmtDowShort(toLocalIso(next.time))}`;
}

// ---------- Push notifications (OneSignal, via /api functions) ----------
let oneSignalPlayerId = localStorage.getItem('oneSignalPlayerId') || null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 8000);
}

function refreshNotifyStatus(){
  const el = document.getElementById('notifyStatus');
  if(!('Notification' in window)){
    el.textContent = 'This browser does not support push notifications — use the .ics download instead.';
    return;
  }
  if(Notification.permission === 'denied'){
    el.textContent = 'Notifications are blocked in your browser/phone settings — use the .ics download instead.';
  } else if(oneSignalPlayerId){
    el.textContent = 'Phone alerts are on. You\u2019ll get a push the evening before, and 1 hour before each duty starts. Push isn\u2019t always 100% reliable on iPhone \u2014 the calendar download below is a more dependable backup.';
  } else {
    el.textContent = 'Turn on alerts to get a push the evening before, and 1 hour before each duty starts.';
  }
}

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal){
  if(ONESIGNAL_APP_ID === 'YOUR_ONESIGNAL_APP_ID'){
    console.warn('Set ONESIGNAL_APP_ID in app_script.js before deploying.');
    return;
  }
  await OneSignal.init({ appId: ONESIGNAL_APP_ID });
  const existing = OneSignal.User.PushSubscription.id;
  if(existing){
    oneSignalPlayerId = existing;
    localStorage.setItem('oneSignalPlayerId', existing);
  }
  OneSignal.User.PushSubscription.addEventListener('change', (e)=>{
    if(e.current && e.current.id){
      oneSignalPlayerId = e.current.id;
      localStorage.setItem('oneSignalPlayerId', oneSignalPlayerId);
      refreshNotifyStatus();
      scheduleServerNotifications();
    }
  });
  refreshNotifyStatus();
});

document.getElementById('btnEnableNotify').onclick = ()=>{
  if(ONESIGNAL_APP_ID === 'YOUR_ONESIGNAL_APP_ID'){
    toast('This deployment needs a OneSignal App ID set up first');
    return;
  }
  OneSignalDeferred.push(async function(OneSignal){
    await OneSignal.Notifications.requestPermission();
    refreshNotifyStatus();
    if(OneSignal.User.PushSubscription.id){
      oneSignalPlayerId = OneSignal.User.PushSubscription.id;
      localStorage.setItem('oneSignalPlayerId', oneSignalPlayerId);
      toast('Phone alerts enabled');
      scheduleServerNotifications();
    }
  });
};

document.getElementById('btnTestAlert').onclick = async ()=>{
  if(!oneSignalPlayerId){ toast('Enable phone alerts first'); return; }
  const cps = buildCheckpoints();
  const sample = cps[0] || { label: 'Sign on', sub: 'Duty — · sample' };
  const sendAt = new Date(Date.now() + 60*1000);
  try{
    const res = await fetch(`${NOTIFY_API_BASE}/schedule-notifications`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        playerId: oneSignalPlayerId,
        checkpoints: [{ title: sample.label, body: sample.sub, sendAfter: sendAt.toISOString() }],
      }),
    });
    const data = await res.json();
    if(!res.ok || data.error){ toast('Error: ' + (data.error || res.status)); return; }
    const ok = (data.results||[]).some(r=>r.id);
    toast(ok ? `Test alert booked for ${fmtClock(sendAt)}` : '0 sent: ' + JSON.stringify((data.results||[])[0]||{}).slice(0,140));
  }catch(e){
    toast('Could not reach the notification server');
  }
};

function pad2(n){ return n.toString().padStart(2,'0'); }
function toICSDate(d){
  return d.getUTCFullYear() + pad2(d.getUTCMonth()+1) + pad2(d.getUTCDate()) + 'T' + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + '00Z';
}
function buildICS(){
  const now = new Date();
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Sharston Board//EN\r\n';
  Object.keys(assignments).forEach(iso=>{
    const dcfg = dateConfig(iso);
    const dutyNo = assignments[iso];
    const duty = findDuty(dcfg, dutyNo);
    if(!duty) return;
    const signOn = parseTimeOnDate(iso, duty.sp[0].on);
    if(signOn <= now) return;
    const end = signOn;
    ics += 'BEGIN:VEVENT\r\n';
    ics += 'UID:sharston-signon-' + iso + '@duty-board\r\n';
    ics += 'DTSTAMP:' + toICSDate(new Date()) + '\r\n';
    ics += 'DTSTART:' + toICSDate(signOn) + '\r\n';
    ics += 'DTEND:' + toICSDate(end) + '\r\n';
    ics += 'SUMMARY:Sign on \u2014 Duty ' + duty.d + '\r\n';
    ics += 'BEGIN:VALARM\r\nTRIGGER:-PT15M\r\nACTION:DISPLAY\r\nDESCRIPTION:Sign on soon\r\nEND:VALARM\r\n';
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  return ics;
}
document.getElementById('btnIcs').onclick = ()=>{
  if(!Object.keys(assignments).length){ toast('Set at least one duty first'); return; }
  const blob = new Blob([buildICS()], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sharston-signon-times.ics';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Downloaded \u2014 open it to add sign-on reminders to your calendar');
};

function buildNightBeforeReminders(){
  const out = [];
  Object.keys(assignments).forEach(iso=>{
    const dcfg = dateConfig(iso);
    const dutyNo = assignments[dcfg.iso];
    if(!dutyNo) return;
    const duty = findDuty(dcfg, dutyNo);
    if(!duty) return;
    const signOn = parseTimeOnDate(dcfg.iso, duty.sp[0].on);
    const reminder = new Date(signOn);
    reminder.setDate(reminder.getDate()-1);
    reminder.setHours(20,0,0,0); // 8pm the evening before
    out.push({ time: reminder, label: 'Duty tomorrow', sub: `Duty ${duty.d} \u00b7 signs on ${fmtTime(duty.sp[0].on)}` });
  });
  return out;
}

function buildPushPayloads(){
  const now = new Date();
  const payloads = [];

  // 1 hour before sign-on, per assigned duty day
  buildCheckpoints().filter(c=>c.label==='Sign on').forEach(c=>{
    const hourBefore = new Date(c.time.getTime() - 60*60000);
    if(hourBefore > now){
      payloads.push({ title: 'Duty in 1 hour', body: c.sub, sendAfter: hourBefore.toISOString() });
    }
  });

  // Evening-before reminder
  buildNightBeforeReminders().forEach(r=>{
    if(r.time > now) payloads.push({ title: r.label, body: r.sub, sendAfter: r.time.toISOString() });
  });

  return payloads;
}

async function scheduleServerNotifications(){
  if(!oneSignalPlayerId) return;
  if(NOTIFY_API_BASE === 'YOUR_WORKER_URL'){
    toast('Notification server not set up yet');
    return;
  }
  const prevIds = JSON.parse(localStorage.getItem('pushIds') || '[]');
  if(prevIds.length){
    try{
      await fetch(`${NOTIFY_API_BASE}/cancel-notifications`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ ids: prevIds }),
      });
    }catch(e){ /* best effort */ }
  }
  const payloads = buildPushPayloads();
  if(!payloads.length){ localStorage.setItem('pushIds','[]'); return; }
  try{
    const res = await fetch(`${NOTIFY_API_BASE}/schedule-notifications`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ playerId: oneSignalPlayerId, checkpoints: payloads }),
    });
    const data = await res.json();
    if(!res.ok || data.error){
      toast('Error: ' + (data.error || res.status));
      return;
    }
    const ids = (data.results || []).map(r=>r.id).filter(Boolean);
    localStorage.setItem('pushIds', JSON.stringify(ids));
    if(ids.length === 0 && data.results && data.results.length){
      const firstFail = data.results.find(r=>!r.ok) || data.results[0];
      const raw = firstFail && firstFail.raw ? JSON.stringify(firstFail.raw) : (firstFail && firstFail.error) || 'unknown';
      toast('0 sent: ' + raw.slice(0,140));
    } else {
      toast(`Scheduled ${ids.length} phone alerts`);
    }
  }catch(e){
    toast('Could not reach the notification server');
  }
}

// ---------- Init ----------
async function init(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  }
  await loadAssignments();
  selectedIso = todayIso();
  weekAnchor = selectedIso;
  renderCalendarNav();
  renderDutyArea();
  refreshNotifyStatus();
  updateNext();
  setInterval(updateNext, 1000);
}
init();
